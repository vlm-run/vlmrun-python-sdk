name: Main CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    defaults:
      run:
        shell: bash -el {0}
    env:
      CACHE_NUMBER: 0

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-${{ matrix.python-version }}-${{
            hashFiles('pyproject.toml') }}-${{ hashFiles('MANIFEST.in') }}-${{
            env.CACHE_NUMBER }}
          restore-keys: |
            uv-${{ matrix.python-version }}-

      - name: Install base dependencies
        run: |
          which python
          pip install uv
          uv pip install --system -e '.[test,all]'

      - name: Quality Check
        uses: pre-commit/action@v3.0.1
        continue-on-error: true

      - name: Run all tests
        run: |
          # Install all extras and run complete test suite
          uv pip install --system -e '.[all]'
          pytest tests/common/test_dependencies.py -v
          make test

  test-lowest:
    # Guards the floors in pyproject.toml: core dependencies resolve to the
    # oldest versions allowed, on the oldest supported Python.
    name: Test (lowest core dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lowest core dependencies
        run: |
          pip install uv
          # Core first at their floors; the extras and test tools then install
          # around them without upgrading what is already satisfied.
          uv pip install --system --resolution lowest-direct -e .
          uv pip install --system -e '.[test,all]'
          uv pip list --system

      - name: Run all tests
        run: |
          make test
