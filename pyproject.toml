[build-system]
requires = ["setuptools>=40.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmrun"
description = "Official Python SDK for VLM Run"
authors = [{name = "VLM Support", email = "support@vlm.com"}]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research","Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = {text = "Apache-2.0"}
# Core dependencies are floors, not pins: vlmrun is installed next to other
# libraries (openai, Pillow, pydantic, ...) and an exact pin or a speculative
# upper bound makes those environments unresolvable. Each floor is the oldest
# version the test suite passes against (the `lowest` CI job checks this);
# pydantic keeps its <3 cap because v3 is a declared breaking release.
dependencies = [
    "cachetools>=5.0",
    "loguru>=0.7.0",
    # 1.92 promoted `chat.completions.stream` out of beta.
    "openai>=1.92",
    # 10.3 fixes CVE-2024-28219 (buffer overflow in _imagingcms).
    "Pillow>=10.3.0",
    # 2.9 is what vlmrun-hub's datamodel-code-generator imports against.
    "pydantic>=2.9,<3",
    "requests>=2.31.0",
    "rich>=13.0",
    "tenacity>=8.2",
    # Older typer releases don't cap click and break on click>=8.2.
    "typer>=0.15.4",
    "vlmrun-hub>=0.1.28",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest", "pre-commit"]
build = ["twine", "build"]
# Upper bounds are the next major above what is released today: enough room for
# the versions in the wild, closed against an unvetted major.
video = [
    "numpy>=1.24.0,<3.0",
    "opencv-python>=4.8.0,<6.0",
]
doc = [
    "pypdfium2>=4.30.0,<6.0",
]
typesafe = [
    # Still 0.x, where a minor may break; bounded at the 1.0 boundary pip sees.
    "typesafe-sdk>=0.7.1,<1.0",
]
ws = [
    # 14.0 is the floor, not 13: `websockets.connect` only became the asyncio
    # client there, and the session uses its `additional_headers`. On 13.x the
    # name resolves to the legacy client, which takes `extra_headers` instead.
    "websockets>=14.0,<18.0",
]
all = [
    "numpy>=1.24.0,<3.0",
    "opencv-python>=4.8.0,<6.0",
    "pypdfium2>=4.30.0,<6.0",
    "pandas<4.0",
    "ipython<10.0",
    "typesafe-sdk>=0.7.1,<1.0",
    "websockets>=14.0,<18.0",
]

[tool.setuptools.dynamic]
version = {attr = "vlmrun.version.__version__"}

[tool.setuptools.packages.find]
include = ["vlmrun*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[project.scripts]
vlmrun = "vlmrun.cli.cli:app"
